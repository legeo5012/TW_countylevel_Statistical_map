<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>統計地圖工作室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    .county-path {
      cursor: pointer;
      vector-effect: non-scaling-stroke;
      transition: fill 0.22s ease, stroke 0.18s ease, filter 0.2s ease;
      stroke: #334155;
      stroke-width: 1px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .county-path:hover {
      filter: brightness(0.88) drop-shadow(0 0 3px rgba(0,0,0,0.35));
      stroke: #090d16;
      stroke-width: 2.2px;
    }
    .county-label {
      pointer-events: none;
      user-select: none;
      font-size: 11px;
      font-weight: 700;
      fill: #0f172a;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .county-label-sm {
      font-size: 9.5px;
    }
    .map-svg-label {
      font-size: 5px;
      font-weight: 700;
      fill: #0f172a;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 1.2px;
      stroke-linejoin: round;
      stroke-linecap: round;
      pointer-events: none;
      user-select: none;
    }
    .map-svg-label-sm {
      font-size: 4px;
    }
    /* Office color picker style */
    .office-palette-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 3px;
    }
    .office-color-box {
      width: 19px;
      height: 19px;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.12s ease, outline 0.12s ease;
    }
    .office-color-box:hover {
      transform: scale(1.18);
      z-index: 10;
      outline: 2px solid #2563eb;
      border-color: #ffffff;
    }
    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #print-capture-area, #print-capture-area * {
        visibility: visible;
      }
      #print-capture-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-blue-100 selection:text-blue-800">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black text-slate-900 leading-tight">統計地圖工作室</h1>
          <p class="text-xs text-slate-500 hidden sm:block">臺灣</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="btn-toggle-labels" class="inline-flex items-center space-x-1 px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
          <span id="label-toggle-text">隱藏地名</span>
        </button>
        <button id="btn-reset-all" class="inline-flex items-center space-x-1 px-3 py-1.5 text-xs font-semibold rounded-lg border border-red-200 bg-red-50 text-red-700 hover:bg-red-100 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span class="hidden sm:inline">重設填色</span>
        </button>
        <button id="btn-export-image" class="inline-flex items-center space-x-1.5 px-3.5 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white hover:bg-blue-700 shadow-sm transition active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>匯出成果學習單</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full px-3 sm:px-6 py-4 flex-1 flex flex-col lg:flex-row gap-5">
    
    <!-- LEFT SIDEBAR: Controls & Settings -->
    <aside class="w-full lg:w-[430px] flex flex-col gap-4 no-print order-2 lg:order-1">
      
      <!-- CARD 1: Student & Map Metadata -->
      <section class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <span class="w-6 h-6 rounded-md bg-blue-100 text-blue-700 inline-flex items-center justify-center text-xs font-black">1</span>
            地圖基本資訊（圖名與作者）
          </h2>
          <span class="text-xs text-blue-600 font-semibold">必填</span>
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1" for="input-map-title">地圖名稱 (圖名) <span class="text-red-500">*</span></label>
            <input type="text" id="input-map-title" value="" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-slate-800 transition" placeholder="例如：台灣各縣市人口密度分級圖">
          </div>

          <!-- Student info row -->
          <div class="grid grid-cols-3 gap-2 pt-1">
            <div>
              <label class="block text-[11px] font-medium text-slate-500 mb-0.5" for="input-student-class">班級</label>
              <input type="text" id="input-student-class" value="" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:ring-1 focus:ring-blue-400" placeholder="例如：101">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-slate-500 mb-0.5" for="input-student-no">座號</label>
              <input type="text" id="input-student-no" value="" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:ring-1 focus:ring-blue-400" placeholder="例如：01">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-slate-500 mb-0.5" for="input-student-name">姓名</label>
              <input type="text" id="input-student-name" value="" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:ring-1 focus:ring-blue-400 font-medium" placeholder="學生姓名">
            </div>
          </div>
        </div>
      </section>

      <!-- CARD 2: Class & Color Settings -->
      <section class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 relative">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <span class="w-6 h-6 rounded-md bg-blue-100 text-blue-700 inline-flex items-center justify-center text-xs font-black">2</span>
            分級數目、區間與色彩
          </h2>
          <span class="text-xs text-slate-400">點色塊選色</span>
        </div>

        <!-- Class count selector -->
        <div class="flex items-center justify-between mb-3.5 text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
          <span class="font-bold text-slate-700">統計分級數目：</span>
          <div class="inline-flex rounded-lg p-0.5 bg-slate-200 border border-slate-300/80">
            <button class="class-num-btn px-2.5 py-1 text-xs font-semibold rounded-md transition" data-classes="3">3 級</button>
            <button class="class-num-btn px-2.5 py-1 text-xs font-semibold rounded-md transition" data-classes="4">4 級</button>
            <button class="class-num-btn px-2.5 py-1 text-xs font-semibold rounded-md transition" data-classes="5">5 級</button>
            <button class="class-num-btn px-2.5 py-1 text-xs font-semibold rounded-md bg-white text-blue-700 shadow-sm" data-classes="6">6 級</button>
          </div>
        </div>

        <!-- Unit specification -->
        <div class="mb-3">
          <label class="block text-xs font-semibold text-slate-600 mb-1" for="input-map-unit">統計指標單位說明 (顯示於圖例)</label>
          <input type="text" id="input-map-unit" value="" class="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 transition" placeholder="例如：人／平方公里、公噸、戶">
        </div>

        <!-- Class Color Pickers & Range Inputs Container -->
        <div class="space-y-2 mb-3" id="legend-editor-container">
          <!-- Dynamically populated rows with color buttons and min ~ max inputs -->
        </div>

        <!-- Eraser Tool Button -->
        <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
          <button id="btn-eraser-tool" class="brush-selector-btn flex items-center space-x-2 px-3 py-2 text-xs font-semibold rounded-xl border border-slate-300 hover:bg-slate-50 transition w-full justify-center">
            <span class="w-4 h-4 rounded border border-slate-400 bg-white flex items-center justify-center text-slate-500 font-bold text-[10px]">✕</span>
            <span>橡皮擦（清除該區填色）</span>
          </button>
        </div>
      </section>

      <section class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-600">填色進度與各級行政區一覽</h3>
          <span id="colored-progress-badge" class="text-xs font-bold px-2 py-0.5 bg-blue-50 text-blue-700 rounded-full">0 / 38 區</span>
        </div>
        <p class="text-xs text-slate-500 mb-3">點選筆刷後點擊地圖塗色。各分級對應行政區將自動條列於此，供學生作答學習單分析：</p>
        <div id="class-summary-list" class="space-y-1.5 text-xs">
          <!-- Filled dynamically by JavaScript -->
        </div>
      </section>
    </aside>

    <!-- RIGHT: Map Canvas & Poster Container -->
    <div class="flex-1 flex flex-col items-center order-1 lg:order-2">

      <!-- CURRENT ACTIVE BRUSH BAR -->
      <div class="w-full flex items-center justify-between bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm mb-3 no-print">
        <div class="flex items-center space-x-2.5">
          <span class="text-xs font-bold text-slate-600">目前使用筆刷：</span>
          <div class="flex items-center space-x-2 bg-slate-50 px-3 py-1 rounded-lg border border-slate-200">
            <span id="active-brush-swatch" class="w-4 h-4 rounded-md shadow-inner inline-block" style="background-color: #5b9bd5;"></span>
            <span id="active-brush-label" class="text-xs font-bold text-slate-800">第 1 級</span>
          </div>
        </div>
        <div class="text-xs text-slate-400 hidden sm:block">提示：點擊下方各區進行填色</div>
      </div>

      <div id="print-capture-area" class="w-full bg-white rounded-2xl border border-slate-200 p-4 sm:p-7 shadow-sm flex flex-col relative transition-all">
        
        <!-- MAP POSTER HEADER (Title & Student Meta) -->
        <div class="border-b-2 border-slate-800 pb-3 mb-3 flex flex-col sm:flex-row sm:items-end justify-between gap-2">
          <div>
            <h2 id="poster-map-title" class="text-lg sm:text-2xl font-black text-slate-900 tracking-tight min-h-[1.75rem]"></h2>
          </div>
          <!-- Student meta badge -->
          <div class="text-right sm:border-l sm:border-slate-200 sm:pl-4">
            <div id="poster-student-meta" class="text-xs text-slate-700 font-bold min-h-[1rem]"></div>
            <div id="poster-date-meta" class="text-[11px] text-slate-500"></div>
          </div>
        </div>

        <!-- MAP CONTAINER (SVG + Insets + Compass) -->
        <div class="relative w-full aspect-[4/5] sm:aspect-[1/1] max-h-[750px] flex items-center justify-center overflow-hidden bg-slate-50/60 rounded-xl border border-slate-200">
          
          <!-- Zoom Controls (Top Left) -->
          <div data-html2canvas-ignore="true" class="absolute top-3 left-3 flex flex-col shadow-sm rounded-lg overflow-hidden border border-slate-300 z-10 bg-white/90 backdrop-blur-sm no-print">
            <button id="btn-zoom-in" class="p-2 text-slate-600 hover:bg-slate-100 border-b border-slate-200 transition" title="放大">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12M6 12h12"/></svg>
            </button>
            <button id="btn-zoom-reset" class="p-2 text-slate-600 hover:bg-slate-100 border-b border-slate-200 transition" title="重設縮放與位置">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8m0-5v5h5"/></svg>
            </button>
            <button id="btn-zoom-out" class="p-2 text-slate-600 hover:bg-slate-100 transition" title="縮小">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12h12"/></svg>
            </button>
          </div>

          <!-- Compass Rose (North Arrow) -->
          <div class="absolute top-3 right-4 flex flex-col items-center pointer-events-none select-none z-10">
            <span class="text-[12px] font-black text-slate-900 tracking-wider mb-0.5 leading-none">N</span>
            <svg class="w-6 h-8 text-slate-800 drop-shadow-sm" viewBox="0 0 24 28" fill="currentColor">
              <polygon points="12,1 4,24 12,18" fill="#0f172a"/>
              <polygon points="12,1 20,24 12,18" fill="#94a3b8"/>
            </svg>
          </div>

          <!-- MAIN CONTAINER SVG WITH ACCURATE USER DATA -->

  <!-- OFFICE COLOR PICKER MODAL / POPOVER -->
  <div id="office-picker-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs hidden p-4">
    <div class="bg-white rounded-xl shadow-2xl border border-slate-300 w-full max-w-[290px] overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="bg-slate-100 px-3.5 py-2 border-b border-slate-200 flex items-center justify-between">
        <span class="text-xs font-bold text-slate-800">色彩選擇器</span>
        <button id="btn-close-picker" class="text-slate-400 hover:text-slate-700 text-sm font-bold leading-none">✕</button>
      </div>

      <div class="p-3.5 space-y-3 select-none">
        <!-- 1. Theme Colors -->
        <div>
          <div class="text-[11px] font-bold text-slate-700 mb-1.5">佈景主題色彩</div>
          <!-- Base 10 colors row -->
          <div id="theme-base-row" class="office-palette-grid mb-1"></div>
          <!-- 5 Tints & Shades rows -->
          <div id="theme-shades-grid" class="office-palette-grid"></div>
        </div>

        <!-- 2. Standard Colors -->
        <div class="pt-2 border-t border-slate-100">
          <div class="text-[11px] font-bold text-slate-700 mb-1.5">標準色彩</div>
          <div id="standard-colors-row" class="office-palette-grid"></div>
        </div>

        <!-- 3. Custom / Other Colors -->
        <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
          <label class="cursor-pointer inline-flex items-center space-x-2 text-xs text-slate-700 hover:text-blue-600 font-semibold">
            <span class="text-sm">🎨</span>
            <span>其他色彩 (自訂)...</span>
            <input type="color" id="native-color-picker" class="sr-only">
          </label>
          <span id="current-target-class-badge" class="text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-bold">第 1 級</span>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    // State Store
    const state = {
      mapTitle: "",
      mapUnit: "",
      studentClass: "",
      studentNo: "",
      studentName: "",
      showLabels: true,
      classCount: 6,
      activeBrushIndex: 0,
      pickingForClassIndex: null,
      classes: [],
      countyData: {}
    };

    // List of 38 official Kaohsiung districts
    const ALL_COUNTIES = [
      "楠梓區", "左營區", "鼓山區", "三民區", "苓雅區", "新興區", "前金區", "鹽埕區", 
      "前鎮區", "旗津區", "小港區", "鳳山區", "茂林區", "甲仙區", "六龜區", "杉林區", 
      "美濃區", "內門區", "仁武區", "田寮區", "旗山區", "梓官區", "阿蓮區", "湖內區", 
      "岡山區", "茄萣區", "路竹區", "鳥松區", "永安區", "燕巢區", "大樹區", "大寮區", 
      "林園區", "彌陀區", "橋頭區", "大社區", "那瑪夏區", "桃源區"
    ];

    // Name normalization mapping
    function normalizeCountyName(name) {
      if (!name) return "";
      return name.trim();
    }

    // Initial default sequential blue colors for up to 6 classes
    const INITIAL_DEFAULT_COLORS = [
      '#deebf7', '#c6dbef', '#9ecae1', '#6baed6', '#3182bd', '#08519c'
    ];

    // Helper to format the range text: "min ～ max"
    function formatRangeText(cls, idx) {
      const min = (cls.min || "").trim();
      const max = (cls.max || "").trim();
      if (!min && !max) return `第 ${idx + 1} 級`;
      if (min && max) return `${min} ～ ${max}`;
      if (min && !max) return `≥ ${min}`;
      return `≤ ${max}`;
    }

    // Microsoft Office Theme Colors definition
    const OFFICE_THEME_BASE = [
      '#ffffff', '#000000', '#eeece1', '#1f497d', '#4f81bd', '#c0504d', '#9bbb59', '#8064a2', '#4bacc6', '#f79646'
    ];

    const OFFICE_THEME_SHADES = [
      ['#f2f2f2', '#7f7f7f', '#ddd9c3', '#c6d9f1', '#dbe5f1', '#f2dcdb', '#ebf1dd', '#e5e0ec', '#dbeef3', '#fdeada'],
      ['#d8d8d8', '#595959', '#c4bd97', '#8db3e2', '#b8cce4', '#e5b9b7', '#d7e3bc', '#ccc1da', '#b7dde8', '#fbd5b5'],
      ['#bfbfbf', '#3f3f3f', '#948a54', '#548dd4', '#95b3d7', '#d99694', '#c3d69b', '#b2a2c7', '#92cddc', '#fac08f'],
      ['#a5a5a5', '#262626', '#494529', '#17365d', '#366092', '#953734', '#76933c', '#5f497a', '#31859b', '#e36c09'],
      ['#7f7f7f', '#0c0c0c', '#1d1b10', '#0f243e', '#244062', '#632523', '#4f6128', '#3f3151', '#205867', '#974806']
    ];

    const OFFICE_STANDARD_COLORS = [
      '#c00000', '#ff0000', '#ffc000', '#ffff00', '#92d050', '#00b050', '#00b0f0', '#0070c0', '#002060', '#7030a0'
    ];

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : type === 'warning' ? 'bg-amber-600' : 'bg-slate-800';
      toast.className = `${bg} text-white px-4 py-2 rounded-xl shadow-lg text-xs font-semibold transform transition-all duration-300 opacity-0 translate-y-2 flex items-center space-x-2 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 280);
      }, 2400);
    }

    function initOfficePickerDOM() {
      const baseRow = document.getElementById('theme-base-row');
      const shadesGrid = document.getElementById('theme-shades-grid');
      const stdRow = document.getElementById('standard-colors-row');

      baseRow.innerHTML = '';
      shadesGrid.innerHTML = '';
      stdRow.innerHTML = '';

      OFFICE_THEME_BASE.forEach(c => {
        const box = document.createElement('div');
        box.className = 'office-color-box';
        box.style.backgroundColor = c;
        box.addEventListener('click', () => selectColorFromOffice(c));
        baseRow.appendChild(box);
      });

      for (let r = 0; r < 5; r++) {
        for (let col = 0; col < 10; col++) {
          const color = OFFICE_THEME_SHADES[r][col];
          const box = document.createElement('div');
          box.className = 'office-color-box';
          box.style.backgroundColor = color;
          box.addEventListener('click', () => selectColorFromOffice(color));
          shadesGrid.appendChild(box);
        }
      }

      OFFICE_STANDARD_COLORS.forEach(c => {
        const box = document.createElement('div');
        box.className = 'office-color-box';
        box.style.backgroundColor = c;
        box.addEventListener('click', () => selectColorFromOffice(c));
        stdRow.appendChild(box);
      });

      const nativePicker = document.getElementById('native-color-picker');
      nativePicker.addEventListener('input', (e) => {
        selectColorFromOffice(e.target.value);
      });

      document.getElementById('btn-close-picker').addEventListener('click', closeOfficePicker);
      document.getElementById('office-picker-modal').addEventListener('click', (e) => {
        if (e.target.id === 'office-picker-modal') {
          closeOfficePicker();
        }
      });
    }

    function openOfficePicker(classIdx) {
      state.pickingForClassIndex = classIdx;
      document.getElementById('current-target-class-badge').textContent = `第 ${classIdx + 1} 級`;
      document.getElementById('office-picker-modal').classList.remove('hidden');
    }

    function closeOfficePicker() {
      document.getElementById('office-picker-modal').classList.add('hidden');
      state.pickingForClassIndex = null;
    }

    function selectColorFromOffice(color) {
      if (state.pickingForClassIndex !== null && state.classes[state.pickingForClassIndex]) {
        const idx = state.pickingForClassIndex;
        state.classes[idx].color = color;
        closeOfficePicker();
        renderLegendEditor();
        updateBrushDisplay();
        renderPosterLegend();
        updateMapFillings();
        updateSummaryTable();
        showToast(`第 ${idx + 1} 級顏色已更新`);
      }
    }

    function setupClasses(count) {
      state.classCount = count;
      const newClasses = [];
      for (let i = 0; i < count; i++) {
        const existingColor = state.classes[i]?.color;
        const fallbackColor = INITIAL_DEFAULT_COLORS[i] || '#3b82f6';
        newClasses.push({
          color: existingColor || fallbackColor,
          min: state.classes[i]?.min || "",
          max: state.classes[i]?.max || ""
        });
      }
      state.classes = newClasses;

      if (state.activeBrushIndex >= count) {
        state.activeBrushIndex = 0;
      }

      renderLegendEditor();
      updateBrushDisplay();
      renderPosterLegend();
      updateMapFillings();
      updateSummaryTable();
    }

    function renderLegendEditor() {
      const container = document.getElementById('legend-editor-container');
      container.innerHTML = '';

      state.classes.forEach((cls, idx) => {
        const row = document.createElement('div');
        const isActive = state.activeBrushIndex === idx;
        row.className = `flex items-center space-x-2 p-2 rounded-xl border transition ${
          isActive ? 'border-blue-500 bg-blue-50/70 ring-2 ring-blue-400/40' : 'border-slate-200 hover:bg-slate-50'
        }`;

        row.innerHTML = `
          <!-- Brush Radio Selector -->
          <div class="flex items-center cursor-pointer flex-shrink-0" title="選取為填色筆刷">
            <input type="radio" name="brushSelection" ${isActive ? 'checked' : ''} class="w-4 h-4 text-blue-600 focus:ring-0 cursor-pointer">
          </div>

          <!-- Color Swatch Button -->
          <button type="button" class="open-office-palette-btn flex items-center space-x-1.5 px-2 py-1 bg-white rounded-lg border border-slate-300 shadow-sm hover:border-slate-500 transition flex-shrink-0" title="點擊開啟 Office 色彩盤">
            <span class="w-5 h-5 rounded border border-black/20 shadow-inner inline-block" style="background-color: ${cls.color};"></span>
            <span class="text-[10px] text-slate-500 font-bold">選色 ▾</span>
          </button>

          <!-- Dual Min ~ Max Range Inputs -->
          <div class="flex-1 flex items-center space-x-1">
            <input type="text" value="${cls.min || ''}" data-index="${idx}" data-field="min"
                   class="legend-range-input w-full px-2 py-1 text-xs text-center rounded-lg border border-slate-200 focus:border-blue-500 focus:bg-white bg-white font-medium text-slate-800 transition"
                   placeholder="下限">
            <span class="text-slate-400 font-bold text-xs select-none">～</span>
            <input type="text" value="${cls.max || ''}" data-index="${idx}" data-field="max"
                   class="legend-range-input w-full px-2 py-1 text-xs text-center rounded-lg border border-slate-200 focus:border-blue-500 focus:bg-white bg-white font-medium text-slate-800 transition"
                   placeholder="上限">
          </div>

          <!-- Select Brush Tag -->
          <button type="button" class="set-brush-btn text-[11px] font-bold px-2 py-1 rounded-md ${isActive ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'} transition flex-shrink-0">
            ${isActive ? '使用中' : '選取'}
          </button>
        `;

        row.addEventListener('click', (e) => {
          if (!e.target.closest('.open-office-palette-btn') && !e.target.classList.contains('legend-range-input')) {
            setActiveBrush(idx);
          }
        });

        row.querySelector('.open-office-palette-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          openOfficePicker(idx);
        });

        const rangeInputs = row.querySelectorAll('.legend-range-input');
        rangeInputs.forEach(input => {
          input.addEventListener('input', (e) => {
            const field = e.target.dataset.field;
            state.classes[idx][field] = e.target.value;
            updateBrushDisplay();
            renderPosterLegend();
            updateSummaryTable();
          });
        });

        container.appendChild(row);
      });
    }

    function setActiveBrush(index) {
      state.activeBrushIndex = index;
      renderLegendEditor();
      updateBrushDisplay();
      
      const eraserBtn = document.getElementById('btn-eraser-tool');
      if (index === -1) {
        eraserBtn.classList.add('bg-red-100', 'border-red-400', 'text-red-700', 'font-bold');
        showToast('已切換為：橡皮擦（清除填色）');
      } else {
        eraserBtn.classList.remove('bg-red-100', 'border-red-400', 'text-red-700', 'font-bold');
        const text = formatRangeText(state.classes[index], index);
        showToast(`已切換為筆刷：${text}`);
      }
    }

    function updateBrushDisplay() {
      const swatch = document.getElementById('active-brush-swatch');
      const label = document.getElementById('active-brush-label');
      
      if (state.activeBrushIndex === -1) {
        swatch.style.backgroundColor = '#ffffff';
        swatch.style.border = '1px solid #94a3b8';
        label.textContent = '橡皮擦（點擊清除行政區填色）';
      } else {
        const cls = state.classes[state.activeBrushIndex];
        if (cls) {
          swatch.style.backgroundColor = cls.color;
          swatch.style.border = 'none';
          const rangeStr = formatRangeText(cls, state.activeBrushIndex);
          label.textContent = `第 ${state.activeBrushIndex + 1} 級 (${rangeStr})`;
        }
      }
    }

    function renderPosterLegend() {
      const legendContainer = document.getElementById('poster-legend-items');
      const unitContainer = document.getElementById('poster-legend-unit');
      legendContainer.innerHTML = '';

      // Update unit display
      if (state.mapUnit && state.mapUnit.trim()) {
        unitContainer.textContent = `[ 單位：${state.mapUnit.trim()} ]`;
      } else {
        unitContainer.textContent = '';
      }

      state.classes.forEach((cls, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center space-x-1.5';
        const labelText = formatRangeText(cls, idx);
        item.innerHTML = `
          <span class="w-4 h-4 rounded border border-slate-700 shadow-sm flex-shrink-0" style="background-color: ${cls.color};"></span>
          <span class="text-xs text-slate-800 font-medium">${labelText}</span>
        `;
        legendContainer.appendChild(item);
      });

      const uncoloredItem = document.createElement('div');
      uncoloredItem.className = 'flex items-center space-x-1.5 opacity-70';
      uncoloredItem.innerHTML = `
        <span class="w-4 h-4 rounded border border-slate-400 bg-white flex-shrink-0"></span>
        <span class="text-xs text-slate-500">未填色／無資料</span>
      `;
      legendContainer.appendChild(uncoloredItem);
    }

    function updateMapFillings() {
      ALL_COUNTIES.forEach(countyName => {
        const aliases = [countyName];
        if (countyName === "臺北市") aliases.push("台北市");
        if (countyName === "臺中市") aliases.push("台中市");
        if (countyName === "臺南市") aliases.push("台南市");
        if (countyName === "臺東縣") aliases.push("台東縣");

        const selector = aliases.map(a => `[data-name="${a}"], #${a}`).join(', ');
        const paths = document.querySelectorAll(selector);
        const classIdx = state.countyData[countyName];

        paths.forEach(p => {
          if (classIdx !== undefined && classIdx !== null && state.classes[classIdx]) {
            p.setAttribute('fill', state.classes[classIdx].color);
          } else {
            p.setAttribute('fill', '#ffffff');
          }
        });
      });
    }

    function updateSummaryTable() {
      const summaryList = document.getElementById('class-summary-list');
      summaryList.innerHTML = '';

      let coloredCount = 0;
      const classBuckets = Array.from({ length: state.classCount }, () => []);
      const uncoloredList = [];

      ALL_COUNTIES.forEach(c => {
        const idx = state.countyData[c];
        if (idx !== undefined && idx !== null && idx < state.classCount) {
          classBuckets[idx].push(c);
          coloredCount++;
        } else {
          uncoloredList.push(c);
        }
      });

      document.getElementById('colored-progress-badge').textContent = `${coloredCount} / 38 區已填`;

      state.classes.forEach((cls, idx) => {
        const counties = classBuckets[idx] || [];
        const item = document.createElement('div');
        item.className = 'p-2 rounded-lg bg-slate-50 border border-slate-100 flex flex-col space-y-1';
        const labelText = formatRangeText(cls, idx);
        item.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-1.5">
              <span class="w-3 h-3 rounded-full border border-slate-400" style="background-color: ${cls.color}"></span>
              <span class="font-bold text-slate-800">${labelText}</span>
            </div>
            <span class="font-semibold text-slate-500">${counties.length} 個行政區</span>
          </div>
          <div class="text-[11px] text-slate-600 pl-4">
            ${counties.length > 0 ? counties.join('、') : '<span class="italic text-slate-400">尚無填色行政區</span>'}
          </div>
        `;
        summaryList.appendChild(item);
      });

      if (uncoloredList.length > 0) {
        const unItem = document.createElement('div');
        unItem.className = 'p-2 rounded-lg bg-slate-100/60 border border-dashed border-slate-300 flex flex-col space-y-1 text-slate-500';
        unItem.innerHTML = `
          <div class="flex items-center justify-between text-[11px]">
            <span class="font-medium">尚未填色行政區 (${uncoloredList.length})</span>
          </div>
          <div class="text-[11px] text-slate-400 pl-1">
            ${uncoloredList.join('、')}
          </div>
        `;
        summaryList.appendChild(unItem);
      }
    }

    function initMapInteractions() {
      const svg = document.getElementById('taiwan-svg');
      const tooltip = document.getElementById('county-tooltip');
      const tooltipTitle = document.getElementById('tooltip-title');
      const tooltipDesc = document.getElementById('tooltip-desc');

      svg.addEventListener('click', (e) => {
        const path = e.target.closest('.county-path');
        if (!path) return;

        const rawName = path.getAttribute('data-name') || path.id;
        const countyName = normalizeCountyName(rawName);
        if (!countyName) return;

        if (state.activeBrushIndex === -1) {
          delete state.countyData[countyName];
          showToast(`已清除 ${countyName} 填色`);
        } else {
          state.countyData[countyName] = state.activeBrushIndex;
          const currentText = formatRangeText(state.classes[state.activeBrushIndex], state.activeBrushIndex);
          showToast(`已將 ${countyName} 設定為：${currentText}`);
        }
        updateMapFillings();
        updateSummaryTable();
      });

      svg.addEventListener('mousemove', (e) => {
        const path = e.target.closest('.county-path');
        if (path) {
          const rawName = path.getAttribute('data-name') || path.id;
          const countyName = normalizeCountyName(rawName);
          const classIdx = state.countyData[countyName];
          let statusText = '點擊填色';
          if (classIdx !== undefined && state.classes[classIdx]) {
            statusText = `目前分級：${formatRangeText(state.classes[classIdx], classIdx)}`;
          }
          tooltipTitle.textContent = countyName;
          tooltipDesc.textContent = statusText;
          tooltip.classList.remove('hidden');

          const containerRect = svg.parentElement.getBoundingClientRect();
          const x = e.clientX - containerRect.left + 12;
          const y = e.clientY - containerRect.top + 12;
          tooltip.style.left = `${x}px`;
          tooltip.style.top = `${y}px`;
        } else {
          tooltip.classList.add('hidden');
        }
      });

      svg.addEventListener('mouseleave', () => {
        tooltip.classList.add('hidden');
      });
    }

    function initMapZoom() {
      if (typeof d3 === 'undefined') return;
      
      const svgContainer = d3.select("#taiwan-svg");
      const zoomGroup = d3.select("#map-zoom-group");

      const zoom = d3.zoom()
        .scaleExtent([1, 15]) // 允許放大到 15 倍，方便點選細小行政區
        .on("zoom", (event) => {
          zoomGroup.attr("transform", event.transform);
        });

      // 綁定縮放與拖曳事件到最外層 SVG
      svgContainer.call(zoom);

      // UI 按鈕控制邏輯
      document.getElementById('btn-zoom-in').addEventListener('click', () => {
        svgContainer.transition().duration(300).call(zoom.scaleBy, 1.5);
      });
      
      document.getElementById('btn-zoom-out').addEventListener('click', () => {
        svgContainer.transition().duration(300).call(zoom.scaleBy, 1 / 1.5);
      });
      
      document.getElementById('btn-zoom-reset').addEventListener('click', () => {
        svgContainer.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
      });
    }

    function initEvents() {
      // Map Title
      const titleInput = document.getElementById('input-map-title');
      titleInput.addEventListener('input', (e) => {
        state.mapTitle = e.target.value;
        document.getElementById('poster-map-title').textContent = state.mapTitle;
      });

      // Unit
      const unitInput = document.getElementById('input-map-unit');
      unitInput.addEventListener('input', (e) => {
        state.mapUnit = e.target.value;
        renderPosterLegend();
      });

      // Student info synchronization
      function updateStudentMeta() {
        const c = document.getElementById('input-student-class').value.trim();
        const no = document.getElementById('input-student-no').value.trim();
        const n = document.getElementById('input-student-name').value.trim();
        const parts = [];
        if (c) parts.push(`班級：${c}`);
        if (no) parts.push(`座號：${no}`);
        if (n) parts.push(`姓名：${n}`);
        document.getElementById('poster-student-meta').textContent = parts.join(' ');
      }
      document.getElementById('input-student-class').addEventListener('input', updateStudentMeta);
      document.getElementById('input-student-no').addEventListener('input', updateStudentMeta);
      document.getElementById('input-student-name').addEventListener('input', updateStudentMeta);

      // Toggle County Labels button
      document.getElementById('btn-toggle-labels').addEventListener('click', () => {
        state.showLabels = !state.showLabels;
        const labels = document.querySelectorAll('.county-label');
        labels.forEach(l => l.style.display = state.showLabels ? 'block' : 'none');
        document.getElementById('label-toggle-text').textContent = state.showLabels ? '隱藏地名' : '顯示地名';
      });

      // Reset All button
      document.getElementById('btn-reset-all').addEventListener('click', () => {
        state.countyData = {};
        updateMapFillings();
        updateSummaryTable();
        showToast('已清空所有行政區填色', 'warning');
      });

      // Class Count selector buttons (3, 4, 5, 6)
      document.querySelectorAll('.class-num-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.class-num-btn').forEach(b => {
            b.classList.remove('bg-white', 'text-blue-700', 'shadow-sm');
          });
          btn.classList.add('bg-white', 'text-blue-700', 'shadow-sm');
          const count = parseInt(btn.dataset.classes, 10);
          setupClasses(count);
          showToast(`已切換為 ${count} 個分級`);
        });
      });

      // Eraser Tool Button
      document.getElementById('btn-eraser-tool').addEventListener('click', () => {
        setActiveBrush(-1);
      });

      // Export Image via html2canvas
      document.getElementById('btn-export-image').addEventListener('click', () => {
        const captureArea = document.getElementById('print-capture-area');
        showToast('正在產生高解析度圖檔，請稍候...');

        html2canvas(captureArea, {
          scale: 2.5,
          useCORS: true,
          backgroundColor: '#ffffff'
        }).then(canvas => {
          const imageURL = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          const cleanTitle = (state.mapTitle || '統計地圖').replace(/\s+/g, '_');
          const studentName = document.getElementById('input-student-name').value.trim() || '學習單';
          link.download = `${cleanTitle}_${studentName}.png`;
          link.href = imageURL;
          link.click();
          showToast('地圖已成功匯出為 PNG 圖檔！可直接列印或貼入學習單。', 'success');
        }).catch(err => {
          console.error(err);
          showToast('匯出失敗，請重試或直接使用瀏覽器列印功能', 'warning');
        });
      });
    }

    // Startup
    window.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      document.getElementById('poster-date-meta').textContent = `製圖日期：${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;

      initOfficePickerDOM();
      setupClasses(6);
      initMapZoom();
      initMapInteractions();
      initEvents();
    });
  </script>
</body>
</html>
